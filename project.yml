# Xcode-projektet genereras ur den här filen (XcodeGen) och är gitignorerat.
# Ingen Mac behövs: Codemagic kör `xcodegen generate` före bygget.
name: Hopp
options:
  bundleIdPrefix: se.birdiebook
  deploymentTarget:
    iOS: "17.0"
packages:
  HoppKit:
    path: HoppKit
targets:
  Hopp:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HoppKit
        product: Jump
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.birdiebook.hopp
        MARKETING_VERSION: "0.1.0"
        # Skrivs över av Codemagics byggräknare (agvtool) vid varje bygge.
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hopp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Utan den här fastnar varje bygge på exportfrågan i App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Hopp filmar hoppet i slow motion för att mäta tiden i luften. Videon stannar på telefonen.
    scheme: {}
